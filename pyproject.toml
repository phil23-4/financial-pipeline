[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin_pipeline"
version = "0.1.0"
description = "A modular data processing pipeline for SEC filings and private PDFs into SurrealDB"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.1.0",
    "surrealdb>=0.3.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pdfplumber>=0.10.0",
    "pypdf>=3.10.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.3",
    "pillow>=10.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fin-pipeline = "fin_pipeline.cli:main"
