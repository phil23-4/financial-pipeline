[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin_pipeline"
version = "0.1.0"
description = "A modular data processing pipeline to extract and ingest SEC filings and private annual reports PDFs into SurrealDB"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT"}
authors = [
    { name = "Phillip Francis Chapita", email = "francis@phillipchapita.com" }
]
keywords = [
    "finance",
    "sec",
    "edgar",
    "financial-data",
    "sec-filings",
    "pdf",
    "ocr",
    "surrealdb",
    "pdf-parser",
    "xbrl",
    "document-ingestion",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "surrealdb>=0.3.1",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "PyMuPDF>=1.23",
    "pymupdf4llm>=0.0.17",
    "rapidocr-onnxruntime>=1.2.3",
    "camelot-py>=1.0.0",
    "loguru>=0.7.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
sec = [
    "edgartools>=5.55.0",
]

[project.urls]
Homepage = "https://github.com/phil23-4/financial-pipeline"
Documentation = "https://github.com/phil23-4/financial-pipeline#readme"
Repository = "https://github.com/phil23-4/financial-pipeline.git"
Issues = "https://github.com/phil23-4/financial-pipeline/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fin-pipeline = "fin_pipeline.cli:main"

# Tool Configurations
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true